spring.application.name=a

# ===================================================================
# DATASOURCE CONFIGURATION
# ===================================================================
# Replace 'localhost:5432/your_database_name' with your actual host, port, and DB name
spring.datasource.url=jdbc:postgresql://localhost:5432/fullstack_db
spring.datasource.username=postgres
spring.datasource.password=Mance16
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# JPA / HIBERNATE CONFIGURATION
# ===================================================================
# DDL generation (Update) - Creates/updates tables automatically. 
# Use 'validate' or 'none' in production to avoid accidental data loss.
spring.jpa.hibernate.ddl-auto=update

# Database dialect to help Hibernate optimize SQL queries for PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Show SQL queries in the console (useful for development)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===================================================================
# HIKARI CONNECTION POOL CONFIGURATION (Optional but Recommended)
# ===================================================================
# Maximum number of actual connections to the database
spring.datasource.hikari.maximum-pool-size=10
# Minimum number of idle connections in the pool
spring.datasource.hikari.minimum-idle=5
# Maximum time (in milliseconds) that a connection can sit idle
spring.datasource.hikari.idle-timeout=300000
# Maximum lifetime of a connection in the pool
spring.datasource.hikari.max-lifetime=1800000