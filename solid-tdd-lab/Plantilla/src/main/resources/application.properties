spring.application.name=grasp-ut

# Using H2 in-memory database so we don't need PostgreSQL
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Tell Spring we are using H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Auto create and drop tables every time the app runs
spring.jpa.hibernate.ddl-auto=create-drop

# Show SQL queries in console
spring.jpa.show-sql=true

# Enable H2 browser console for debugging
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=8080